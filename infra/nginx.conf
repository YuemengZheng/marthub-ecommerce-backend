events {}
http {
  upstream marthub_backend {
    server app1:8080;
    server app2:8080;
    server app3:8080;
  }
  server {
    listen 80;
    location / {
      proxy_pass http://marthub_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Eligibility-Token $http_x_eligibility_token;
    }
  }
}
