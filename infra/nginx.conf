events {}
http {
  upstream marthub_backend {
    server app1:8080;
    server app2:8080;
    server app3:8080;
  }

  # Where a per-caller request rate belongs. The application used to carry a per-user token bucket
  # inside its admission path, which was the wrong place for it twice over: it was standing in for a
  # concurrency limit the app now states directly, and "how many requests may one caller send" is an
  # edge concern that should never have reached a Lua script next to the order logic.
  #
  # Keyed on the session token because that is the identity the application knows. nginx skips the
  # limit when the key is empty, so unauthenticated and public requests are unaffected -- which also
  # means this is not a defence against an anonymous flood; that would need $binary_remote_addr, and
  # behind a load balancer it needs a trustworthy client IP first.
  limit_req_zone $http_x_auth_token zone=per_session:10m rate=5r/s;
  limit_req_status 429;

  server {
    listen 80;

    location /api/ {
      limit_req zone=per_session burst=5 nodelay;
      proxy_pass http://marthub_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Eligibility-Token $http_x_eligibility_token;
    }

    # Deliberately exempt. These endpoints exist to measure the application's own admission layer,
    # and an edge limit in front of them would report nginx's configuration instead.
    location / {
      proxy_pass http://marthub_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Eligibility-Token $http_x_eligibility_token;
    }
  }
}
