events { worker_connections 8192; }
http {
  access_log off;
  upstream marthub_backend {
    server app1:8080;
    server app2:8080;
    server app3:8080;
    keepalive 256;
  }
  server {
    listen 80;

    # Harness calibration target. Answered by nginx itself, so a rate measured here is the
    # ceiling the load generator plus the network path can produce -- nothing behind it can
    # legitimately measure higher.
    location = /_ping { return 200 "pong\n"; }

    location /api/ {
      limit_req zone=per_session burst=5 nodelay;
      proxy_pass http://marthub_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Eligibility-Token $http_x_eligibility_token;
    }
    location / {
      proxy_pass http://marthub_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Eligibility-Token $http_x_eligibility_token;
    }
  }
  limit_req_zone $http_x_auth_token zone=per_session:10m rate=5r/s;
  limit_req_status 429;
}
