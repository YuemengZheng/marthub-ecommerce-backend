name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # The Lua scripts behind the eligibility gate and the rate limiter are only
    # meaningful against a real server, so CI provides one. Without it those tests
    # skip instead of failing, which would quietly hide them — hence the guard below.
    services:
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Overselling is a race inside InnoDB, so the test that rules it out needs a real one.
      # A mocked JdbcTemplate passes against the broken implementation, which is why this is a
      # service container rather than a test that skips when MySQL is absent.
      mysql:
        image: mysql:8.4
        ports: ['3399:3306']
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: marthub
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      MARTHUB_TEST_REDIS: localhost:6379
      MARTHUB_TEST_MYSQL: localhost:3399
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
      - name: Fail if any test was skipped
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' target/surefire-reports/*.xml \
            | grep -o '[0-9]*' | paste -sd+ - | bc)
          echo "skipped tests: ${skipped:-0}"
          test "${skipped:-0}" -eq 0
