services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: marthub
      MYSQL_USER: marthub
      MYSQL_PASSWORD: marthub
      MYSQL_ROOT_PASSWORD: root
    ports: ["3307:3306"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -proot"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
  app1: &app
    build: .
    environment: &env
      DB_HOST: mysql
      REDIS_HOST: redis
      INSTANCE_ID: app-1
      BENCHMARK_ENABLED: "true"
      FLASH_RATE_PER_SECOND: "20"
      FLASH_BURST_CAPACITY: "20"
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
  app2:
    <<: *app
    environment:
      <<: *env
      INSTANCE_ID: app-2
  app3:
    <<: *app
    environment:
      <<: *env
      INSTANCE_ID: app-3
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    ports: ["8080:80"]
    depends_on: [app1, app2, app3]
