server:
  port: ${SERVER_PORT:8080}

spring:
  session:
    # Idle timeout: Spring Session expires a session this long after its last access.
    timeout: 30m
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:marthub}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:marthub}
    password: ${DB_PASSWORD:marthub}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Fail fast. A cache lookup that takes seconds has already lost its purpose, and a slow
      # Redis is worse than a dead one: every request parks a Tomcat thread for the whole
      # timeout. With Spring Session on Redis too that is every authenticated request, so a 2s
      # timeout could park the entire pool and take down endpoints that never touch the cache.
      # A normal hit is sub-millisecond; 200ms is already hundreds of times that.
      timeout: 200ms
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

marthub:
  instance-id: ${INSTANCE_ID:local}
  auth:
    # Idle timeout is spring.session.timeout below; this is the hard ceiling on top of it.
    absolute-lifetime: 12h
  cache:
    l1-max-size: 10000
    # Short on purpose: cross-instance L1 invalidation rides on Redis pub/sub, which is
    # fire-and-forget, so this TTL -- not the broadcast -- bounds how long an instance that
    # missed the message can serve stale data.
    l1-ttl-seconds: 10
    l2-ttl-seconds: 600
    # Spread expiries so keys created together (warmup, post-deploy refill burst) do not all
    # miss at the same instant.
    l2-ttl-jitter-seconds: 120
    delayed-eviction-ms: 500
  flash-sale:
    token-ttl-seconds: 300
    gate-multiplier: 5
    rate-per-second: ${FLASH_RATE_PER_SECOND:200}
    burst-capacity: ${FLASH_BURST_CAPACITY:200}
    sold-out-ttl-hours: 6
  benchmark:
    enabled: ${BENCHMARK_ENABLED:false}
